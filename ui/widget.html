<!doctype html>
<!-- Widget Game Bar de KaneMode (native\KaneMode.Widget) : HUD par-dessus les jeux (profils d'énergie,
     écran, système, son, réseau, jeu en cours). Affiché dans le widget, qui relaie les requêtes vers
     KaneMode (core.js, WIDGET). -->
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KaneMode</title>
  <link rel="stylesheet" href="app.css">
</head>
<body class="widget">
  <!-- Logo de KaneMode (repris d'index.html) : dans la page, plus besoin de relire index.html au démarrage -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="brand-grad" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="48" y2="48">
        <stop offset="0" stop-color="var(--accent)"/><stop offset="1" stop-color="#6a5cff"/>
      </linearGradient>
    </defs>
    <symbol id="i-brand" viewBox="0 0 48 48"><rect width="48" height="48" rx="12" fill="#0b0e13"/><rect x="1" y="1" width="46" height="46" rx="11" fill="none" stroke="url(#brand-grad)" stroke-width="2"/><g fill="url(#brand-grad)"><path d="M8 11h6v10.2L23.6 11H31L20.6 22.2 31.4 37h-7.3l-7.6-10.6-2.5 2.6V37H8z"/><circle cx="35.5" cy="18.6" r="2.7"/><circle cx="40.6" cy="24" r="2.7"/><circle cx="35.5" cy="29.4" r="2.7"/><circle cx="30.4" cy="24" r="2.7"/></g></symbol>
  </svg>
  <main id="hud">
    <header class="hud-head">
      <svg class="brand-mark"><use href="#i-brand"/></svg>
      <div><b>KaneMode</b><small id="hud-version"></small></div>
      <span class="hud-watts" id="hud-watts" hidden></span>
    </header>
    <div id="hud-status" class="hud-status" hidden></div>
    <div id="hud-body"></div>
  </main>
  <div id="toast" role="status" aria-live="polite" aria-atomic="true"></div>
  <div id="busy" hidden><i class="spinner"></i><span></span></div>
  <script type="module" src="js/widget.js"></script>
</body>
</html>
