<!doctype html>
<!-- Moniteur en direct de KaneMode (widget Game Bar « KaneMode · Moniteur », native\KaneMode.Widget) :
     un petit bandeau à épingler sur le jeu. Les mesures à afficher se choisissent dans le widget
     KaneMode (catégorie Moniteur). -->
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KaneMode · Moniteur</title>
  <link rel="stylesheet" href="app.css">
</head>
<body class="widget monitor">
  <main id="mon">
    <div id="mon-cells" class="mon-cells"></div>
    <div id="mon-badges" class="mon-badges"></div>
    <div id="mon-change" class="mon-change" hidden></div>
  </main>
  <script type="module" src="js/monitor.js"></script>
</body>
</html>
